services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    labels:
      - instance=mysql_${WORK_ENV}
    deploy:
      placement:
        constraints:
          - node.role == manager
    env_file: ".env.${WORK_ENV}"
    command:
      - "--log_bin_trust_function_creators=1"
      - "--lower_case_table_names=1"
      - "--explicit_defaults_for_timestamp"
    ports:
      - ${MYSQL_EXPOSE_PORT}:3306
    configs:
      - source: mysql_config
        target: /etc/mysql/conf.d/my.cnf
      - source: mysql_init_script
        target: /docker-entrypoint-initdb.d/init.sh
      - source: patch_43_common
        target: /opt/patch_43_common.sql
      - source: patch_47_common
        target: /opt/patch_47_common.sql
    volumes:
      - "/data/mysql/${WORK_ENV}:/var/lib/mysql"
  postgres:
    image: postgres:${POSTGRES_VERSION}
    labels:
      - instance=postgres_${WORK_ENV}
    deploy:
      placement:
        constraints:
          - node.role == manager
    env_file: ".env.${WORK_ENV}"
    command:
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    ports:
      - ${POSTGRES_EXPOSE_PORT}:5432
    configs:
      - source: postgres_config
        target: /etc/postgresql/postgresql.conf
      - source: postgres_init_script
        target: /docker-entrypoint-initdb.d/init.sh
    volumes:
      - "/data/postgres/${WORK_ENV}:/var/lib/postgresql/data"
      # - "/data/backup/postgres/${WORK_ENV}:/backup"
configs:
  mysql_config:
    file: ./mysql.cnf
  mysql_init_script:
    file: ./mysqldb/init.sh
  patch_43_common:
    file: ./mysqldb/patch_43_common.sql
  patch_47_common:
    file: ./mysqldb/patch_47_common.sql
  postgres_config:
    file: ./postgresdb/postgresql.conf
  postgres_init_script:
    file: ./postgresdb/init.sh
